<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RAG Eval Dashboard — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#0f1720; height:100vh; margin:0; display:flex; align-items:center; justify-content:center; }
  .card { background:#fff; border-radius:12px; padding:40px 36px; width:340px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  h1 { font-size:20px; margin:0 0 4px; color:#0f1720; }
  p.sub { color:#64748b; font-size:13px; margin:0 0 24px; }
  input[type=password] { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; margin-bottom:14px; }
  button { width:100%; padding:10px 12px; background:#0f1720; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:#1e293b; }
  .error { color:#dc2626; font-size:13px; margin-bottom:12px; }
</style>
</head>
<body>
  <form class="card" method="post">
    <h1>RAG Eval Dashboard</h1>
    <p class="sub">RAGAS scoring for the GenAI Academy RAG agent</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
