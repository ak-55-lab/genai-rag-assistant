services:
  rag-eval:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Persist eval run history across rebuilds/restarts.
      - ./results:/srv/results
    extra_hosts:
      # Lets the container reach n8n running on your host machine at
      # localhost:5678. Docker Desktop (Mac/Windows) resolves
      # host.docker.internal automatically; this line makes it work on
      # Linux too.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
